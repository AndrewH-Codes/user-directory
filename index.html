<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>User Directory</title>
</head>
<body>

    <h1>User Directory</h1>

    <div class="controls">
        <button hidden id="reloadUsersButton">Load Users</button>

        <input hidden type="text" id="searchInput" placeholder="Search Users...">

        <select hidden autocomplete="off" id="optionPicker">
            <option value="" selected disabled>-- Select how to sort --</option>
            <option value="nameA-Z">Name (A-Z)</option>
            <option value="nameZ-A">Name (Z-A)</option>
            <option value="cityA-Z">City (A-Z)</option>
        </select>
    </div>

    <p id="status"></p>

    <ul id="userList"></ul>

    <script src="main.js"></script>

</body>
</html>
